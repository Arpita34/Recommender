<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SHL Assessment Recommender</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 800px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 20px;
      gap: 16px;
    }

    header {
      text-align: center;
      padding: 16px 0 8px;
    }
    header h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.3px;
    }
    header p {
      font-size: 0.82rem;
      color: #64748b;
      margin-top: 4px;
    }
    .badge {
      display: inline-block;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 3px 12px;
      font-size: 0.72rem;
      color: #38bdf8;
      margin-top: 8px;
    }

    #chat-window {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 8px 4px;
      scrollbar-width: thin;
      scrollbar-color: #334155 transparent;
    }

    .msg {
      display: flex;
      flex-direction: column;
      max-width: 85%;
      animation: fadeIn 0.25s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    .msg.user { align-self: flex-end; align-items: flex-end; }
    .msg.assistant { align-self: flex-start; align-items: flex-start; }

    .bubble {
      padding: 11px 16px;
      border-radius: 18px;
      font-size: 0.9rem;
      line-height: 1.55;
    }
    .msg.user .bubble {
      background: #2563eb;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.assistant .bubble {
      background: #1e293b;
      color: #cbd5e1;
      border-bottom-left-radius: 4px;
      border: 1px solid #2d3748;
    }

    .recommendations {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      width: 100%;
    }

    .rec-card {
      background: #0f2044;
      border: 1px solid #1e3a6e;
      border-radius: 10px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: background 0.2s;
    }
    .rec-card:hover { background: #162a55; }

    .rec-badge {
      background: #1d4ed8;
      color: #bfdbfe;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      min-width: 28px;
      text-align: center;
      letter-spacing: 0.5px;
    }
    .rec-info { flex: 1; }
    .rec-name {
      font-size: 0.85rem;
      font-weight: 600;
      color: #e2e8f0;
    }
    .rec-link {
      font-size: 0.72rem;
      color: #38bdf8;
      text-decoration: none;
    }
    .rec-link:hover { text-decoration: underline; }

    .input-row {
      display: flex;
      gap: 10px;
      padding: 4px 0 8px;
    }

    #user-input {
      flex: 1;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      color: #e2e8f0;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      padding: 12px 16px;
      outline: none;
      transition: border-color 0.2s;
      resize: none;
    }
    #user-input:focus { border-color: #2563eb; }

    #send-btn {
      background: #2563eb;
      border: none;
      border-radius: 12px;
      color: #fff;
      cursor: pointer;
      font-size: 1.1rem;
      padding: 0 18px;
      transition: background 0.2s;
    }
    #send-btn:hover { background: #1d4ed8; }
    #send-btn:disabled { background: #334155; cursor: not-allowed; }

    #reset-btn {
      background: transparent;
      border: 1px solid #334155;
      border-radius: 12px;
      color: #64748b;
      cursor: pointer;
      font-size: 0.78rem;
      padding: 0 14px;
      transition: all 0.2s;
    }
    #reset-btn:hover { border-color: #ef4444; color: #ef4444; }

    .turn-counter {
      text-align: center;
      font-size: 0.72rem;
      color: #475569;
    }
    .turn-counter span { color: #f59e0b; font-weight: 600; }

    .typing { display: flex; align-items: center; gap: 6px; padding: 12px 16px; }
    .typing span {
      width: 8px; height: 8px;
      background: #475569;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.7); opacity: 0.5; }
      40% { transform: scale(1); opacity: 1; }
    }

    .end-banner {
      text-align: center;
      background: #14532d;
      border: 1px solid #166534;
      border-radius: 10px;
      padding: 10px;
      font-size: 0.82rem;
      color: #86efac;
      margin-top: 4px;
    }
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1>SHL Assessment Recommender</h1>
    <p>Describe your hiring need and I'll find the right assessments.</p>
    <span class="badge">Individual Test Solutions Only</span>
  </header>

  <div id="chat-window"></div>

  <div class="turn-counter">Turn <span id="turn-num">0</span> / 8</div>

  <div class="input-row">
    <textarea id="user-input" rows="1" placeholder="e.g. I'm hiring a Java developer for a mid-level role..." onkeydown="handleKey(event)"></textarea>
    <button id="send-btn" onclick="sendMessage()">➤</button>
    <button id="reset-btn" onclick="resetChat()">↺ Reset</button>
  </div>
</div>

<script>
  let messages = [];

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  async function sendMessage() {
    const input = document.getElementById('user-input');
    const text = input.value.trim();
    if (!text || document.getElementById('send-btn').disabled) return;

    input.value = '';
    messages.push({ role: 'user', content: text });
    appendBubble('user', text);
    updateTurnCounter();

    const btn = document.getElementById('send-btn');
    btn.disabled = true;

    // Show typing indicator
    const typingEl = appendTyping();

    try {
      const res = await fetch('http://localhost:8000/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages })
      });
      const data = await res.json();

      typingEl.remove();

      messages.push({ role: 'assistant', content: data.reply });
      appendBubble('assistant', data.reply, data.recommendations);
      updateTurnCounter();

      if (data.end_of_conversation) {
        appendEndBanner();
        btn.disabled = true;
        input.disabled = true;
      }
    } catch(err) {
      typingEl.remove();
      appendBubble('assistant', '⚠️ Could not reach the server. Make sure uvicorn is running on port 8000.');
    }

    btn.disabled = false;
    scrollToBottom();
  }

  function appendBubble(role, text, recs) {
    const win = document.getElementById('chat-window');
    const msg = document.createElement('div');
    msg.className = `msg ${role}`;

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    msg.appendChild(bubble);

    if (recs && recs.length > 0) {
      const recContainer = document.createElement('div');
      recContainer.className = 'recommendations';
      recs.forEach(r => {
        const card = document.createElement('div');
        card.className = 'rec-card';
        card.innerHTML = `
          <span class="rec-badge">${r.test_type}</span>
          <div class="rec-info">
            <div class="rec-name">${r.name}</div>
            <a class="rec-link" href="${r.url}" target="_blank">${r.url}</a>
          </div>`;
        recContainer.appendChild(card);
      });
      msg.appendChild(recContainer);
    }

    win.appendChild(msg);
    scrollToBottom();
  }

  function appendTyping() {
    const win = document.getElementById('chat-window');
    const msg = document.createElement('div');
    msg.className = 'msg assistant';
    msg.innerHTML = `<div class="bubble typing"><span></span><span></span><span></span></div>`;
    win.appendChild(msg);
    scrollToBottom();
    return msg;
  }

  function appendEndBanner() {
    const win = document.getElementById('chat-window');
    const banner = document.createElement('div');
    banner.className = 'end-banner';
    banner.textContent = '✅ Conversation complete. The agent has provided its final shortlist.';
    win.appendChild(banner);
    scrollToBottom();
  }

  function updateTurnCounter() {
    document.getElementById('turn-num').textContent = messages.length;
  }

  function scrollToBottom() {
    const win = document.getElementById('chat-window');
    win.scrollTop = win.scrollHeight;
  }

  function resetChat() {
    messages = [];
    document.getElementById('chat-window').innerHTML = '';
    document.getElementById('turn-num').textContent = '0';
    document.getElementById('send-btn').disabled = false;
    document.getElementById('user-input').disabled = false;
  }
</script>
</body>
</html>
